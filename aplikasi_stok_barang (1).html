<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Stok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
        .tab-inactive:hover { color: #374151; border-bottom: 2px solid #d1d5db; }
        
        /* Custom scrollbar for table container */
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
    <!-- Include Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-indigo-600">
                <i data-lucide="package" class="w-6 h-6"></i>
                <h1 class="font-bold text-xl tracking-tight">StockMaster</h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="auth-status" class="text-sm text-gray-500 flex items-center gap-1">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyambungkan...
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full flex flex-col lg:flex-row gap-6">
        
        <!-- Left Panel: Input Forms -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4 shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="flex border-b border-gray-200">
                    <button onclick="switchTab('in')" id="tab-in" class="flex-1 py-3 text-sm text-center transition-colors tab-active">
                        <i data-lucide="arrow-down-to-line" class="w-4 h-4 inline-block mr-1"></i> Barang Masuk
                    </button>
                    <button onclick="switchTab('out')" id="tab-out" class="flex-1 py-3 text-sm text-center transition-colors tab-inactive">
                        <i data-lucide="arrow-up-from-line" class="w-4 h-4 inline-block mr-1"></i> Barang Keluar
                    </button>
                </div>
                
                <div class="p-5">
                    <form id="transaction-form" class="flex flex-col gap-4">
                        <input type="hidden" id="form-type" value="in">
                        
                        <div>
                            <label for="item-name" class="block text-sm font-medium text-gray-700 mb-1">Nama Barang</label>
                            <input type="text" id="item-name" required placeholder="Contoh: Kertas HVS A4" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                            <!-- Helper list for suggestions (optional visual cue, handled manually below) -->
                            <datalist id="item-suggestions"></datalist>
                        </div>
                        
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label for="item-qty" class="block text-sm font-medium text-gray-700 mb-1">Jumlah</label>
                                <input type="number" id="item-qty" required min="1" placeholder="0" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                            </div>
                            <div class="flex-1">
                                <label for="item-date" class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                <input type="date" id="item-date" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                            </div>
                        </div>
                        
                        <button type="submit" id="submit-btn" class="mt-2 w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span id="submit-text">Simpan Data Masuk</span>
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Quick Stats Card -->
            <div class="bg-indigo-50 rounded-xl p-5 border border-indigo-100 flex-1 lg:flex-none">
                <h3 class="text-sm font-semibold text-indigo-800 mb-3 uppercase tracking-wider">Ringkasan Sistem</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-lg p-3 shadow-sm border border-indigo-50">
                        <p class="text-xs text-gray-500 mb-1">Total Item Berbeda</p>
                        <p class="text-2xl font-bold text-gray-800" id="stat-unique-items">0</p>
                    </div>
                    <div class="bg-white rounded-lg p-3 shadow-sm border border-indigo-50">
                        <p class="text-xs text-gray-500 mb-1">Total Transaksi</p>
                        <p class="text-2xl font-bold text-gray-800" id="stat-total-tx">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Dashboard Table -->
        <div class="w-full lg:w-2/3 flex flex-col bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex-1 min-h-[400px]">
            <div class="p-4 md:p-5 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-50/50">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                    <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-500"></i> Laporan Stok Saat Ini
                </h2>
                
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="relative flex-1 sm:w-48">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Cari barang..." class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="exportToCSV()" class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors shrink-0">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Export Excel</span>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-auto table-container">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead class="bg-gray-50 text-gray-600 text-sm sticky top-0 z-10 border-b border-gray-200 shadow-sm">
                        <tr>
                            <th class="px-6 py-3 font-medium">Nama Barang</th>
                            <th class="px-6 py-3 font-medium text-center">Total Masuk</th>
                            <th class="px-6 py-3 font-medium text-center">Total Keluar</th>
                            <th class="px-6 py-3 font-medium text-right">Stok Akhir</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- Rows will be populated by JS -->
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-gray-400">
                                <div class="flex flex-col items-center justify-center">
                                    <i data-lucide="loader-2" class="w-6 h-6 animate-spin mb-2"></i>
                                    <p>Memuat data...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Initialize icons
        lucide.createIcons();

        // 1. App Configuration & Environment Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-stock-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Fallback empty config to prevent crash if running outside specific environment
        };

        // UI Elements
        const form = document.getElementById('transaction-form');
        const formType = document.getElementById('form-type');
        const itemName = document.getElementById('item-name');
        const itemQty = document.getElementById('item-qty');
        const itemDate = document.getElementById('item-date');
        const submitBtn = document.getElementById('submit-btn');
        const submitText = document.getElementById('submit-text');
        const tableBody = document.getElementById('inventory-table-body');
        const searchInput = document.getElementById('search-input');
        const authStatus = document.getElementById('auth-status');
        
        // Data State
        let rawTransactions = [];
        let aggregatedInventory = {}; // Key: itemName, Value: { in: number, out: number, current: number }
        let currentUserId = null;
        let unsubscribeDb = null;

        // Set default date to today
        itemDate.valueAsDate = new Date();

        // 2. Setup Firebase
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            initAuth();
        } catch (error) {
            showToast("Gagal menginisialisasi database: " + error.message, "error");
            authStatus.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 text-red-500"></i> Offline';
            lucide.createIcons();
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUserId = auth.currentUser.uid;
                authStatus.innerHTML = '<i data-lucide="wifi" class="w-4 h-4 text-green-500"></i> Terhubung';
                lucide.createIcons();
                
                startDataListener();
            } catch (error) {
                showToast("Gagal autentikasi: " + error.message, "error");
                authStatus.innerHTML = '<i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i> Error Auth';
                lucide.createIcons();
            }
        }

        function startDataListener() {
            if (!currentUserId) return;

            // Follow mandatory path rule: /artifacts/{appId}/users/{userId}/{collectionName}
            const transactionsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'inventory_transactions');

            unsubscribeDb = onSnapshot(transactionsRef, (snapshot) => {
                rawTransactions = [];
                snapshot.forEach(doc => {
                    rawTransactions.push({ id: doc.id, ...doc.data() });
                });
                processData();
            }, (error) => {
                showToast("Gagal mengambil data: " + error.message, "error");
            });
        }

        function processData() {
            // Reset aggregation
            aggregatedInventory = {};

            // Aggregate data in memory
            rawTransactions.forEach(tx => {
                // Ensure field exists
                if(!tx.itemName) return; 

                const name = tx.itemName;
                if (!aggregatedInventory[name]) {
                    aggregatedInventory[name] = { name: name, in: 0, out: 0, current: 0 };
                }

                const qty = parseInt(tx.quantity, 10) || 0;
                
                if (tx.type === 'in') {
                    aggregatedInventory[name].in += qty;
                    aggregatedInventory[name].current += qty;
                } else if (tx.type === 'out') {
                    aggregatedInventory[name].out += qty;
                    aggregatedInventory[name].current -= qty;
                }
            });

            renderTable();
            updateStats();
            updateSuggestions();
        }

        function renderTable(searchFilter = '') {
            tableBody.innerHTML = '';
            
            const inventoryArray = Object.values(aggregatedInventory);
            
            // Filter
            const filteredArray = inventoryArray.filter(item => 
                item.name.toLowerCase().includes(searchFilter.toLowerCase())
            );

            // Sort alphabetical
            filteredArray.sort((a, b) => a.name.localeCompare(b.name));

            if (filteredArray.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                            ${inventoryArray.length === 0 ? "Belum ada data barang. Silahkan input barang masuk pertama kali." : "Barang tidak ditemukan."}
                        </td>
                    </tr>
                `;
                return;
            }

            filteredArray.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                // Color coding for current stock
                let stockClass = "text-gray-900";
                if (item.current <= 0) stockClass = "text-red-600 font-semibold";
                else if (item.current < 10) stockClass = "text-orange-500 font-medium";

                tr.innerHTML = `
                    <td class="px-6 py-4 border-b border-gray-100 font-medium text-gray-900">${escapeHtml(item.name)}</td>
                    <td class="px-6 py-4 border-b border-gray-100 text-center text-green-600 font-medium">+${item.in}</td>
                    <td class="px-6 py-4 border-b border-gray-100 text-center text-red-500 font-medium">-${item.out}</td>
                    <td class="px-6 py-4 border-b border-gray-100 text-right ${stockClass}">${item.current}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function updateStats() {
            const uniqueItemsCount = Object.keys(aggregatedInventory).length;
            const totalTxCount = rawTransactions.length;
            
            document.getElementById('stat-unique-items').innerText = uniqueItemsCount;
            document.getElementById('stat-total-tx').innerText = totalTxCount;
        }

        function updateSuggestions() {
            // Update datalist so user can easily autocomplete existing items
            let datalist = document.getElementById('item-suggestions');
            if(!datalist) {
                datalist = document.createElement('datalist');
                datalist.id = 'item-suggestions';
                document.body.appendChild(datalist);
                itemName.setAttribute('list', 'item-suggestions');
            }
            
            datalist.innerHTML = '';
            Object.keys(aggregatedInventory).sort().forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                datalist.appendChild(option);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUserId) {
                showToast("Belum terhubung ke database. Harap tunggu.", "error");
                return;
            }

            const type = formType.value;
            const name = itemName.value.trim();
            const qty = parseInt(itemQty.value, 10);
            const date = itemDate.value;

            if (!name || isNaN(qty) || qty <= 0 || !date) {
                showToast("Mohon isi semua form dengan benar.", "error");
                return;
            }

            // Validation for outgoing items
            if (type === 'out') {
                const currentStock = aggregatedInventory[name] ? aggregatedInventory[name].current : 0;
                if (qty > currentStock) {
                    showToast(`Stok tidak mencukupi! Stok ${name} saat ini: ${currentStock}`, "error");
                    return;
                }
            }

            // Disable button during submission
            submitBtn.disabled = true;
            const originalText = submitText.innerText;
            submitText.innerText = "Menyimpan...";

            try {
                const transactionsRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'inventory_transactions');
                await addDoc(transactionsRef, {
                    type: type,
                    itemName: name,
                    quantity: qty,
                    date: date,
                    timestamp: serverTimestamp()
                });
                
                showToast(`Berhasil menyimpan data ${type === 'in' ? 'masuk' : 'keluar'} untuk ${name}.`, "success");
                
                // Reset form slightly (keep date)
                itemName.value = '';
                itemQty.value = '';
                itemName.focus();

            } catch (error) {
                showToast("Gagal menyimpan data: " + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitText.innerText = originalText;
            }
        });

        // Tab Switching logic (Global scope for onclick attribute)
        window.switchTab = function(type) {
            const tabIn = document.getElementById('tab-in');
            const tabOut = document.getElementById('tab-out');
            
            formType.value = type;
            
            if (type === 'in') {
                tabIn.className = "flex-1 py-3 text-sm text-center transition-colors tab-active";
                tabOut.className = "flex-1 py-3 text-sm text-center transition-colors tab-inactive";
                submitBtn.className = "mt-2 w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2";
                submitText.innerText = "Simpan Data Masuk";
            } else {
                tabOut.className = "flex-1 py-3 text-sm text-center transition-colors tab-active border-orange-500 text-orange-600 font-semibold";
                tabIn.className = "flex-1 py-3 text-sm text-center transition-colors tab-inactive border-transparent text-gray-500 hover:text-gray-700";
                
                // Customize active out tab color explicitly overriding classes
                tabOut.style.borderBottomColor = '#f97316';
                tabOut.style.color = '#f97316';
                tabIn.style.borderBottomColor = 'transparent';
                tabIn.style.color = '#6b7280';

                submitBtn.className = "mt-2 w-full flex items-center justify-center gap-2 bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2";
                submitText.innerText = "Simpan Data Keluar";
            }
        };

        window.exportToCSV = function() {
            const inventoryArray = Object.values(aggregatedInventory).sort((a, b) => a.name.localeCompare(b.name));
            
            if (inventoryArray.length === 0) {
                showToast("Tidak ada data untuk diexport.", "error");
                return;
            }

            // Create CSV content
            let csvContent = "Nama Barang,Total Masuk,Total Keluar,Stok Akhir\n";
            
            inventoryArray.forEach(item => {
                // Escape quotes in name just in case
                let safeName = item.name.replace(/"/g, '""');
                csvContent += `"${safeName}",${item.in},${item.out},${item.current}\n`;
            });

            // Create Blob and Download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("href", url);
            link.setAttribute("download", `Laporan_Stok_${dateStr}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("File laporan berhasil diunduh.", "success");
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColor = 'bg-gray-800';
            let icon = '<i data-lucide="info" class="w-4 h-4"></i>';
            
            if (type === 'success') {
                bgColor = 'bg-green-600';
                icon = '<i data-lucide="check-circle" class="w-4 h-4"></i>';
            } else if (type === 'error') {
                bgColor = 'bg-red-600';
                icon = '<i data-lucide="alert-circle" class="w-4 h-4"></i>';
            }

            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Utility to prevent XSS
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
        
    </script>
</body>
</html>
